name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 在脚手架目录生成 android/ 平台目录（仓库只保存 Dart 代码，不保存平台脚手架）
      - name: Scaffold android platform
        run: |
          flutter config --no-analytics
          flutter create --org com.jsgx --project-name jsgx_app scaffold
          cp -r scaffold/android ./android
          # 应用名称
          sed -i 's/android:label="jsgx_app"/android:label="技能共享"/' android/app/src/main/AndroidManifest.xml
          # 发布版需要显式声明网络权限
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' android/app/src/main/AndroidManifest.xml

      - name: Apply launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/jsgx-app-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/jsgx-app-arm32.apk
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsgx-app-apk
          path: dist/*.apk

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.0
          name: 技能共享 App v1.0.0
          body: |
            技能共享平台安卓客户端
            - 账号登录注册（与网站数据互通）
            - 服务市场浏览与下单
            - 私信聊天、在线状态显示
            - arm64 适合近几年的手机；老设备用 arm32
          files: |
            dist/jsgx-app-arm64.apk
            dist/jsgx-app-arm32.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
