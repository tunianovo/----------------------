name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold android platform
        run: |
          flutter config --no-analytics
          flutter create --org com.jsgx --project-name jsgx_app scaffold
          cp -r scaffold/android ./android
          sed -i 's/android:label="jsgx_app"/android:label="己曜"/' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><application|' android/app/src/main/AndroidManifest.xml
          node -e "const fs=require('fs');for(const f of ['android/app/build.gradle.kts','android/app/build.gradle']){if(!fs.existsSync(f))continue;let c=fs.readFileSync(f,'utf8');if(f.endsWith('.kts')){c=c.replace(/targetCompatibility = JavaVersion\.VERSION_\d+/g,function(m){return m+'\n        isCoreLibraryDesugaringEnabled = true'})}else{c=c.replace(/targetCompatibility( =)? JavaVersion\.VERSION_\d+/g,function(m){return m+'\n        coreLibraryDesugaringEnabled true'})}fs.writeFileSync(f,c)}"
          [ -f android/app/build.gradle.kts ] && printf '%s\n' 'dependencies {' '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' '}' >> android/app/build.gradle.kts || true
          [ -f android/app/build.gradle ] && printf '%s\n' 'dependencies {' '    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' '}' >> android/app/build.gradle || true

      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: android/app/keystore.jks
          key: jyao-signing-v1

      - name: Signing setup (stable signature + disable R8)
        run: |
          if [ ! -f android/app/keystore.jks ]; then
            keytool -genkeypair -v -keystore android/app/keystore.jks -alias jyao -keyalg RSA -keysize 2048 -validity 10000 -storepass jyao2026 -keypass jyao2026 -dname "CN=jyao,O=jyao,C=CN"
          fi
          node -e "const fs=require('fs');const f='android/app/build.gradle.kts';let c=fs.readFileSync(f,'utf8');if(!c.includes('isMinifyEnabled')){c=c.replace('release {','release {\n            isMinifyEnabled = false\n            isShrinkResources = false')}c=c.replace('signingConfig = signingConfigs.debug','signingConfig = signingConfigs.create(\"release\") {\n                storeFile = file(\"keystore.jks\")\n                storePassword = \"jyao2026\"\n                keyAlias = \"jyao\"\n                keyPassword = \"jyao2026\"\n            }');fs.writeFileSync(f,c)}"

      - name: Apply launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/jsgx-app-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/jsgx-app-arm32.apk
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsgx-app-apk
          path: app/dist/*.apk

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.1.3
          name: 己曜 App v1.1.3
          body: |
            己曜安卓客户端 v1.0.4
            - 后台消息手机通知
            - 聊天发送定位
            - 页面本地缓存秒开（含订单本地保存）
            - 本机头像设置
            - 消息页用户列表、按账号找人
            - 用户端发布需求、需求大厅接单
            - 客服入口、手机号验证码注册
          files: |
            app/dist/jsgx-app-arm64.apk
            app/dist/jsgx-app-arm32.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
