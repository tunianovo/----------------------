name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold android platform
        run: |
          flutter config --no-analytics
          flutter create --org com.jsgx --project-name jsgx_app scaffold
          cp -r scaffold/android ./android
          node tools/patch_gradle.js

      - name: Apply launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/jsgx-app-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/jsgx-app-arm32.apk
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsgx-app-apk
          path: app/dist/*.apk

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.2.3
          name: 己曜 App v1.2.3
          body: |
            己曜安卓客户端 v1.0.4
            - 后台消息手机通知
            - 聊天发送定位
            - 页面本地缓存秒开（含订单本地保存）
            - 本机头像设置
            - 消息页用户列表、按账号找人
            - 用户端发布需求、需求大厅接单
            - 客服入口、手机号验证码注册
          files: |
            app/dist/jsgx-app-arm64.apk
            app/dist/jsgx-app-arm32.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
