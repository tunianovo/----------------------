name: jsgx_app
description: "技能共享平台手机客户端 - 聊天/服务市场/在线状态"
publish_to: 'none'
version: 1.2.2+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.5
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.8.0
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FCF9EE"
  adaptive_icon_foreground: "assets/icon.png"
